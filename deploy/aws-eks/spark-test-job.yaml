apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi-test
  namespace: data-workloads
  labels:
    kueue.x-k8s.io/queue-name: batch-data-queue
spec:
  type: Scala
  mode: cluster
  # Official Apache Spark 3.5.3 image — includes spark-examples jar
  image: apache/spark:3.5.3
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples_2.12-3.5.3.jar
  arguments:
    - "100"
  sparkVersion: "3.5.3"
  sparkConf:
    # S3A filesystem — uses IRSA token via spark-operator-spark SA for auth
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.aws.credentials.provider: com.amazonaws.auth.WebIdentityTokenCredentialsProvider
    spark.hadoop.fs.s3a.endpoint: s3.us-west-1.amazonaws.com
    spark.hadoop.fs.s3a.path.style.access: "true"
    # Write output to region-locked S3 bucket (us-west-1 / SFO)
    spark.app.output.path: s3a://cross-cloud-data-platform-controller-us-west-1/jobs/spark-pi-test/output
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: 512m
    # spark-operator-spark has both K8s pod RBAC and IRSA S3 access
    serviceAccount: spark-operator-spark
    labels:
      version: "3.5.3"
  executor:
    cores: 1
    instances: 2
    memory: 512m
    serviceAccount: spark-operator-spark
    labels:
      version: "3.5.3"
  restartPolicy:
    type: Never
