#
# Key Grafana queries for batch vs interactive contention:
#
#   Queue depth over time:
#     kueue_pending_workloads{cluster_queue=~"batch.*|interactive.*"}
#
#   Preemptions (interactive evicting batch):
#     increase(kueue_evicted_workloads_total{reason="Preempted"}[5m])
#
#   Active workloads per queue:
#     kueue_admitted_active_workloads
#
#   CPU reservation vs quota:
#     kueue_cluster_queue_resource_reservation{resource="cpu"}
#       / on(cluster_queue, flavor)
#     kueue_cluster_queue_nominal_quota{resource="cpu"}
#
#   Admission rate (jobs admitted per minute):
#     rate(kueue_admitted_workloads_total[1m])
