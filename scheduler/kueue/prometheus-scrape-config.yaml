# Standalone Prometheus scrape_config snippet for Kueue metrics.
# Add this to your prometheus.yaml under scrape_configs:
#
# Instructions:
#   1. Run: kubectl port-forward -n kueue-system svc/kueue-controller-manager-metrics-service 9091:8443
#   2. Add this config to prometheus.yml under scrape_configs
#   3. Restart Prometheus
#
# Or use the ServiceMonitor in prometheus-scrape.yaml if using Prometheus Operator.

