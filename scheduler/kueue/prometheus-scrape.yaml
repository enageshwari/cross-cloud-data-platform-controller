---
# Prometheus scrape config for Kueue metrics.
# Apply this on each cluster where Prometheus is running.
#
# If you don't have Prometheus, use scripts/metrics-snapshot.sh instead —
# it does point-in-time scraping via kubectl without any extra install.
#
# Key metrics this scrapes:
#   kueue_pending_workloads              — queue depth per ClusterQueue/status
#   kueue_admitted_workloads_total       — cumulative admissions
#   kueue_evicted_workloads_total        — preemptions by reason (Preempted/PodsReady/etc)
#   kueue_admitted_active_workloads      — currently running workloads per ClusterQueue
#   kueue_cluster_queue_resource_reservation — reserved CPU/memory per queue+flavor
#   kueue_cluster_queue_resource_usage       — actual usage vs reserved

apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-kueue-scraper
  namespace: kueue-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-kueue-scraper
rules:
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["nodes", "pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-kueue-scraper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-kueue-scraper
subjects:
- kind: ServiceAccount
  name: prometheus-kueue-scraper
  namespace: kueue-system
---
# If using Prometheus Operator (kube-prometheus-stack), use this ServiceMonitor.
# Otherwise, add the scrape_config below to your prometheus.yaml manually.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kueue-controller-manager
  namespace: kueue-system
  labels:
    app.kubernetes.io/name: kueue
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: kueue
  endpoints:
  - port: https
    scheme: https
    path: /metrics
    tlsConfig:
      insecureSkipVerify: true
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    interval: 15s
    relabelings:
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
    - sourceLabels: [__meta_kubernetes_service_name]
      targetLabel: service
